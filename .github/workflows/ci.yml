name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start MongoDB (single-node replica set)
        # Order checkout uses multi-document transactions, which require a replica set —
        # a plain standalone mongod (e.g. via a "services:" container) isn't enough here.
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate()"

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build

      - name: Test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/lumera?replicaSet=rs0
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/lumera_test?replicaSet=rs0
          JWT_ACCESS_SECRET: ci_access_secret_needs_at_least_32_characters
          JWT_REFRESH_SECRET: ci_refresh_secret_needs_at_least_32_characters
          COOKIE_SECRET: ci_cookie_secret_min_16_chars
          FRONTEND_URL: http://localhost:5173
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
